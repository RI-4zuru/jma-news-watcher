name: Collect and publish weather news

on:
  schedule:
    # 10-minute target (UTC). GitHub schedules are best effort: delays/skips are possible.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collect.py'
      - 'geography.py'
      - 'regions.json'
      - 'config.json'
      - 'site/index.html'
      - 'site/styles.css'
      - 'site/alerts.html'
      - 'site/app.js'
      - 'site/alerts.js'
      - 'site/common.js'
      - 'site/regions.js'
      - '.github/workflows/news.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jma-news-publishing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect RSS and notify
        run: python3 collect.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Persist collected data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store/news.json site/data.js site/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update news collection [skip ci]'
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        uses: actions/deploy-pages@v4
        id: deployment
